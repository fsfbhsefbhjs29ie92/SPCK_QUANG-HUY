<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Jewelry | Quản Lý Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/order.css">
</head>
<body>
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-dark container">
            <a class="navbar-brand d-flex align-items-center">
                <span class="brand-name">AURA JEWELRY</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">Sản Phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="order.html">Đơn Hàng</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link text-danger" href="#" id="btnLogout"><i class="fa-solid fa-arrow-right-from-bracket me-1"></i> Đăng xuất</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="main-content container my-4">
        <div class="row g-3 mb-5">
            <div class="col-md-6">
                <div class="stat-card">
                    <span class="stat-label">Tổng Đơn Hàng</span>
                    <h2 id="totalOrders" class="stat-value">0</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card border-alert">
                    <span class="stat-label">Đơn Hàng Đã Hủy</span>
                    <h2 id="canceledOrders" class="stat-value text-danger">0</h2>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom-subtle pb-3">
            <div>
                <h2 class="section-title">Danh Sách Đơn Hàng</h2>
                <p class="section-subtitle mb-0">Quản lý trạng thái và vận chuyển</p>
            </div>
        </div>
        <div class="row g-3 mb-4 filter-bar">
            <div class="col-md-4">
                <input type="text" class="form-control custom-input" id="searchUser" placeholder="Tìm theo tên/SĐT khách hàng...">
            </div>
            <div class="col-md-4">
                <input type="date" class="form-control custom-input" id="searchDate">
            </div>
            <div class="col-md-4">
                <input type="number" class="form-control custom-input" id="searchAmount" placeholder="Tìm theo tổng tiền (>=)...">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Mã Đơn</th>
                        <th>Khách Hàng</th>
                        <th>Tổng Tiền</th>
                        <th>Thời Gian</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="6" class="text-center py-5 text-muted">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer class="footer text-center py-4">
        <div class="container">
            <p class="mb-0 text-muted small">© 2026 AURA JEWELRY. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="src/js/orders.js"></script>
</body>
</html>
