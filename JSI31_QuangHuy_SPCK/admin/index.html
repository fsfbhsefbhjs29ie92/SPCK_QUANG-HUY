<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Jewelry | Quản Trị Hệ Thống</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="login-page">

    <!-- Lớp nền Trang sức Điện ảnh (Hiệu ứng thu phóng chậm) -->
    <div class="cinematic-bg"></div>
    <div class="cinematic-overlay"></div>

    <!-- HEADER (Trong suốt) -->
    <header class="header header-transparent">
        <nav class="navbar navbar-expand-lg navbar-dark container">
            <a class="navbar-brand d-flex align-items-center animate-fade-down" href="index.html">
                <span class="brand-name">AURA JEWELRY</span>
            </a>
        </nav>
    </header>

    <!-- MAIN BODY: LOGIN CARD -->
    <main class="main-content d-flex align-items-center justify-content-center">
        <div class="login-wrapper">
            
            <!-- Hộp Đăng Nhập Kính Mờ Bo Góc -->
            <div class="login-card glass-panel p-4 p-sm-5 animate-fade-up">
                
                <div class="text-center mb-4 element-delay-1">
                    <h2 class="login-title">ĐĂNG NHẬP</h2>
                    <p class="login-subtitle">Hệ thống quản trị đặc quyền</p>
                </div>

                <form id="adminLoginForm">
                    <div class="mb-4 form-group element-delay-2">
                        <label for="username" class="form-label">Tài Khoản</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input type="text" class="form-control custom-input-rounded" id="username" placeholder="Nhập tên đăng nhập..." required autocomplete="off">
                        </div>
                    </div>

                    <div class="mb-4 form-group element-delay-3">
                        <label for="password" class="form-label">Mật Khẩu</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" class="form-control custom-input-rounded" id="password" placeholder="Nhập mật khẩu..." required>
                        </div>
                    </div>

                    <div id="errorMessage" class="text-danger mb-3 text-center d-none small element-delay-4">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> Tài khoản hoặc mật khẩu không đúng.
                    </div>

                    <button type="submit" class="btn btn-luxury w-100 element-delay-4">
                        <span class="btn-text">TRUY CẬP HỆ THỐNG</span>
                    </button>
                </form>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer text-center py-4 login-footer animate-fade-up element-delay-5">
        <div class="container">
            <p class="mb-0 text-muted small">© 2026 AURA JEWELRY. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/script.js"></script>
</body>
</html>
