<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Jewelry | Quản Lý Sản Phẩm</title>

    <!-- Bootstrap 5 CSS & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/product.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-dark container">
            <a class="navbar-brand d-flex align-items-center">
                <span class="brand-name">AURA JEWELRY</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="product.html">Sản Phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="order.html">Đơn Hàng</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link text-danger" href="#" id="btnLogout"><i class="fa-solid fa-arrow-right-from-bracket me-1"></i> Đăng xuất</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content container my-4">
        
        <!-- THỐNG KÊ TOÀN DIỆN -->
        <div class="row g-3 mb-5">
            <div class="col-md-6">
                <div class="stat-card">
                    <span class="stat-label">Tổng Sản Phẩm Kho</span>
                    <h2 id="totalProducts" class="stat-value">0</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card border-alert">
                    <span class="stat-label">Cảnh Báo Tồn Kho (≤10)</span>
                    <h2 id="lowStockProducts" class="stat-value text-danger">0</h2>
                </div>
            </div>
        </div>

        <!-- TIÊU ĐỀ & NÚT THÊM -->
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom-subtle pb-3">
            <div>
                <h2 class="section-title">Danh Sách Sản Phẩm</h2>
                <p class="section-subtitle mb-0">Quản lý kho hàng & danh mục trang sức</p>
            </div>
            <button class="btn btn-luxury" id="btnOpenAddModal">
                <i class="fa-solid fa-plus me-2"></i> THÊM SẢN PHẨM
            </button>
        </div>

        <!-- THANH TÌM KIẾM VÀ BỘ LỌC NÂNG CAO (ĐÃ ĐƯA LÊN TRÊN ĐẦU DANH SÁCH) -->
        <div class="row g-3 mb-4 filter-bar">
            <!-- Tìm theo tên -->
            <div class="col-md-3">
                <input type="text" class="form-control custom-input" id="searchName" placeholder="Tìm theo tên sản phẩm...">
            </div>
            <!-- Lọc theo danh mục -->
            <div class="col-md-3">
                <select class="form-control custom-input" id="filterCategory">
                    <option value="">Tất cả danh mục</option>
                    <option value="Kim cương thô">Kim cương thô</option>
                    <option value="Đồng hồ nam">Đồng hồ nam</option>
                    <option value="Đồng hồ nữ">Đồng hồ nữ</option>
                    <option value="Nhẫn">Nhẫn</option>
                    <option value="Dây chuyền">Dây chuyền</option>
                    <option value="Lắc tay/Vòng tay">Lắc tay / Vòng tay</option>
                    <option value="Bông tai">Bông tai</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
            <!-- Lọc theo thương hiệu -->
            <div class="col-md-3">
                <select class="form-control custom-input" id="filterBrand">
                    <option value="">Tất cả thương hiệu</option>
                    <option value="PNJ">PNJ</option>
                    <option value="Rolex">Rolex</option>
                    <option value="Cartier">Cartier</option>
                    <option value="Hublot">Hublot</option>
                    <option value="Omega">Omega</option>
                    <option value="Bvlgari">Bvlgari</option>
                    <option value="Chopard">Chopard</option>
                    <option value="Khác">Thương hiệu khác</option>
                </select>
            </div>
            <!-- Lọc theo khoảng giá -->
            <div class="col-md-3">
                <select class="form-control custom-input" id="filterPrice">
                    <option value="">Tất cả khoảng giá</option>
                    <option value="0-10000000">Dưới 10 Triệu</option>
                    <option value="10000000-50000000">10 Triệu - 50 Triệu</option>
                    <option value="50000000-200000000">50 Triệu - 200 Triệu</option>
                    <option value="200000000-max">Trên 200 Triệu</option>
                </select>
            </div>
        </div>

        <!-- LƯỚI SẢN PHẨM -->
        <div class="row g-4" id="productList">
            <div class="text-center w-100 py-5" id="loadingSpinner">
                <div class="spinner-border text-warning spinner-border-sm" role="status"></div>
                <p class="mt-2 text-muted small">Đang kết nối Firestore...</p>
            </div>
        </div>

    </main>

    <!-- MODAL THÊM / SỬA -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content custom-modal">
                <div class="modal-header">
                    <h5 class="modal-title font-serif" id="modalTitle">Thêm Sản Phẩm Mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tên sản phẩm *</label>
                                <input type="text" class="form-control custom-input" id="pName" placeholder="Tên sản phẩm..." required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Link Ảnh (URL) *</label>
                                <input type="url" class="form-control custom-input" id="pImage" placeholder="https://..." required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Danh mục *</label>
                                <select class="form-control custom-input" id="pCategory" required>
                                    <option value="" disabled selected>Chọn danh mục sản phẩm</option>
                                    <option value="Kim cương thô">Kim cương thô</option>
                                    <option value="Đồng hồ nam">Đồng hồ nam</option>
                                    <option value="Đồng hồ nữ">Đồng hồ nữ</option>
                                    <option value="Nhẫn">Nhẫn</option>
                                    <option value="Dây chuyền">Dây chuyền</option>
                                    <option value="Lắc tay/Vòng tay">Lắc tay / Vòng tay</option>
                                    <option value="Bông tai">Bông tai</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Thương hiệu *</label>
                                <select class="form-control custom-input" id="pBrand" required>
                                    <option value="" disabled selected>Chọn thương hiệu</option>
                                    <option value="PNJ">PNJ</option>
                                    <option value="Rolex">Rolex</option>
                                    <option value="Cartier">Cartier</option>
                                    <option value="Hublot">Hublot</option>
                                    <option value="Omega">Omega</option>
                                    <option value="Bvlgari">Bvlgari</option>
                                    <option value="Chopard">Chopard</option>
                                    <option value="Khác">Thương hiệu khác</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Giá bán (VNĐ) *</label>
                                <input type="number" class="form-control custom-input" id="pPrice" placeholder="0" required min="0">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Giảm giá (%)</label>
                                <input type="number" class="form-control custom-input" id="pDiscount" placeholder="0" min="0" max="100">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Số lượng *</label>
                                <input type="number" class="form-control custom-input" id="pAmount" placeholder="0" required min="0">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Mô tả sản phẩm</label>
                            <textarea class="form-control custom-input" id="pDesc" rows="3" placeholder="Mô tả chi tiết..."></textarea>
                        </div>

                        <div class="text-end">
                            <button type="button" class="btn btn-outline-secondary btn-sm me-2 text-white border-0" data-bs-dismiss="modal">HỦY</button>
                            <button type="submit" class="btn btn-luxury" id="btnSave">LƯU SẢN PHẨM</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer text-center py-4">
        <div class="container">
            <p class="mb-0 text-muted small">© 2026 AURA JEWELRY. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="src/js/product.js"></script>
</body>
</html>
